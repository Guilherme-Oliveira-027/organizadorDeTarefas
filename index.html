<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda de Produtividade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Painel de produtividade</p>
          <h1>Organizador pessoal</h1>
        </div>
        <div class="clock-card">
          <span>Agora</span>
          <strong id="clock">--:--</strong>
        </div>
      </header>

      <main class="dashboard">
        <section class="stats-grid">
          <article class="stat-card">
            <span>Total</span>
            <strong id="totalTasks">0</strong>
          </article>
          <article class="stat-card accent-purple">
            <span>Estudos</span>
            <strong id="studyTasks">0</strong>
          </article>
          <article class="stat-card accent-blue">
            <span>Trabalho</span>
            <strong id="workTasks">0</strong>
          </article>
          <article class="stat-card accent-green">
            <span>Concluídas</span>
            <strong id="doneTasks">0</strong>
          </article>
        </section>

        <section class="content-grid">
          <div class="panel form-panel">
            <div class="panel-header">
              <h2>Nova atividade</h2>
              <span class="save-badge">Dados salvos localmente</span>
            </div>

            <form id="taskForm" class="task-form">
              <label>
                <span>Título</span>
                <input type="text" name="title" placeholder="Ex.: Revisar relatório mensal" required />
              </label>

              <div class="two-columns">
                <label>
                  <span>Categoria</span>
                  <select name="category">
                    <option value="Tarefa">Tarefa</option>
                    <option value="Estudo">Estudo</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Reunião">Reunião</option>
                    <option value="Evento">Evento</option>
                    <option value="Igreja">Igreja</option>
                    <option value="Louvor">Louvor</option>
                  </select>
                </label>

                <label>
                  <span>Status</span>
                  <select name="status">
                    <option value="pendente">Pendente</option>
                    <option value="em andamento">Em andamento</option>
                    <option value="concluída">Concluída</option>
                  </select>
                </label>
              </div>

              <div class="two-columns">
                <label>
                  <span>Data</span>
                  <input type="date" name="date" required />
                </label>

                <label>
                  <span>Horário</span>
                  <input type="time" name="time" required />
                </label>
              </div>

              <label>
                <span>Descrição</span>
                <textarea name="description" rows="4" placeholder="Descreva o objetivo desta atividade..."></textarea>
              </label>

              <button type="submit" class="primary-btn">Adicionar ao planejamento</button>
            </form>
          </div>

          <div class="panel list-panel">
            <div class="panel-header list-header">
              <h2>Agenda e tarefas</h2>
              <div class="filter-group" aria-label="Filtros de categoria">
                <button class="filter-btn active" data-filter="all" type="button">Todos</button>
                <button class="filter-btn" data-filter="Tarefa" type="button">Tarefas</button>
                <button class="filter-btn" data-filter="Estudo" type="button">Estudos</button>
                <button class="filter-btn" data-filter="Trabalho" type="button">Trabalho</button>
                <button class="filter-btn" data-filter="Evento" type="button">Eventos</button>
                <button class="filter-btn" data-filter="Igreja" type="button">Igreja</button>
                <button class="filter-btn" data-filter="Louvor" type="button">Louvor</button>
              </div>
            </div>

            <div id="taskList" class="task-list" aria-live="polite"></div>
          </div>
        </section>

        <section class="panel calendar-panel">
          <div class="panel-header calendar-header">
            <h2>Calendário mensal</h2>
            <div class="calendar-nav">
              <button id="prevMonthBtn" type="button" aria-label="Mês anterior">&#8249;</button>
              <span id="calMonthLabel">Mes atual</span>
              <button id="nextMonthBtn" type="button" aria-label="Próximo mês">&#8250;</button>
            </div>
          </div>

          <div class="calendar-grid week-header" aria-hidden="true">
            <span>Dom</span>
            <span>Seg</span>
            <span>Ter</span>
            <span>Qua</span>
            <span>Qui</span>
            <span>Sex</span>
            <span>Sáb</span>
          </div>

          <div id="calendarDays" class="calendar-grid calendar-days"></div>
        </section>
      </main>
    </div>

    <template id="taskItemTemplate">
      <article class="task-item">
        <div class="task-main">
          <div class="task-heading">
            <span class="task-badge"></span>
            <h3 class="task-title"></h3>
          </div>
          <p class="task-description"></p>
        </div>

        <div class="task-meta">
          <span class="task-date"></span>
          <span class="task-time"></span>
          <span class="task-status"></span>
        </div>

        <div class="task-actions">
          <button class="done-btn" type="button">Concluir</button>
          <button class="delete-btn" type="button">Excluir</button>
        </div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
